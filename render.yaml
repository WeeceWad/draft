# The live Node service on Render's free plan. Game data lives in an external
# PostgreSQL database (Neon's free plan, which does not expire): set DATABASE_URL
# to its connection string in the Render dashboard under Environment.
services:
  - type: web
    name: touchline-auction
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false

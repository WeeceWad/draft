# Creates the live Node service and its persistent database together.
# Free hosting for trying the game. Free PostgreSQL expires after 30 days.
services:
  - type: web
    name: touchline-auction
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: touchline-db
          property: connectionString
databases:
  - name: touchline-db
    region: frankfurt
    plan: free
    databaseName: touchline
    user: touchline
    ipAllowList: []

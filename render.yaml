# Creates the live Node service and its persistent database together.
# Paid plans keep the auction available; review Render's quoted costs before deploying.
services:
  - type: web
    name: touchline-auction
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build && npm test
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: touchline-db
          property: connectionString
databases:
  - name: touchline-db
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    databaseName: touchline
    user: touchline
    ipAllowList: []
